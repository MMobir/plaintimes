
plaintimes: 1
name: uc2
currency: MUSD
discount_rate: 0.05
regions: [R1]
periods: {start: 2025, lengths: [5, 10, 10]}
units: {energy: PJ, capacity: GW}

timeslices:
  W: {D: 0.30, N: 0.20}
  S: {D: 0.28, N: 0.22}

commodities:
  GAS: {kind: energy, unit: PJ}
  COAL: {kind: energy, unit: PJ}
  ELC: {kind: energy, unit: PJ, timeslice: daynite, efficiency: 0.93}
  LIGHT: {kind: demand, unit: PJ, timeslice: daynite, demand: {2025: 100, 2050: 150},
          load_shape: {WD: 0.35, WN: 0.22, SD: 0.25, SN: 0.18}}
  CO2: {kind: emission, unit: kt}
emission_factors:
  GAS: {CO2: 56.1}
  COAL: {CO2: 94.6}
processes:
  GAS_IMP: {outputs: [GAS], varom: {2025: 5, 2050: 7}}
  COAL_IMP: {outputs: [COAL], varom: 2.5}
  LAMP: {inputs: [ELC], outputs: [LIGHT]}
  COAL_PP:
    inputs: [COAL]
    outputs: [ELC]
    efficiency: 0.38
    lifetime: 40
    invcost: 1800
    fixom: 40
    varom: 0.6
    availability: 0.85
    existing: {1995: 1.5}
    emissions: combustion
  GAS_PP:
    inputs: [GAS]
    outputs: [ELC]
    efficiency: {2025: 0.55, 2050: 0.60}
    lifetime: 30
    invcost: {2025: 900, 2050: 800}
    fixom: 20
    availability: 0.9
    emissions: combustion
  WIND:
    tags: [renewable]
    outputs: [ELC]
    lifetime: 25
    invcost: {2025: 1500, 2050: 1000}
    fixom: 35
    availability: {WD: 0.35, WN: 0.40, SD: 0.20, SN: 0.25}
  SOLAR:
    tags: [renewable]
    outputs: [ELC]
    lifetime: 25
    invcost: {2025: 900, 2050: 500}
    fixom: 12
    availability: {W: 0.12, SN: 0.0, SD: 0.38}

constraints:
  RPS:
    terms:
      - {flow: ELC, of: ['tag:renewable'], coef: 1}
      - {production: ELC, coef: {2034: -0.5, 2044: -0.8}}
    sense: ">="
    rhs: 0
    from: 2030
  FOSSIL_CAP:
    terms:
      - {capacity: [GAS_PP], coef: 1}
      - {capacity: [COAL_PP], coef: 0.5}
    sense: "<="
    rhs: {2027: 5, 2034: 3.5, 2044: 2.5}
  BUILD_RATE:
    terms: [{new_capacity: [SOLAR, WIND], coef: 1}]
    sense: "<="
    rhs: {2034: 4.0}
  MIN_GAS_ACT:
    terms: [{activity: [GAS_PP], coef: 1}]
    sense: ">="
    rhs: {2044: 30}
  CUM_MIX:
    periods: sum
    terms:
      - {emission: CO2, coef: 1}
      - {consumption: COAL, coef: 20}
      - {new_capacity: [WIND], coef: -100}
    sense: "<="
    rhs: 150000
